name: CAM fork

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cam-fork-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  turning:
    if: github.repository == 'gohanda11/solidcraft'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '4'
      PYTHONUTF8: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use full temporary paths
        shell: pwsh
        run: |
          # The sandbox deliberately refuses Windows short (8.3) paths.
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo xtask assets
      - run: cargo xtask lists
      - run: cargo xtask layers
      - run: cargo clippy --profile ci -p solidcraft-cam -p solidcraft-engine -p solidcraft-ui-egui --all-targets -- -D warnings
      - run: cargo test --profile ci -p solidcraft-cam --lib
      - run: cargo test --profile ci -p solidcraft-engine --lib cmd::cam
      - run: cargo test --profile ci -p solidcraft-ui-egui --lib
      - run: cargo test --profile ci -p solidcraft-ui-egui --test icon_audit
      - run: cargo xtask wasm
